name: yeshua_beta
description: Yeshua Beta - version avec Supabase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- UI et icônes ---
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  multiavatar: ^0.1.5
  flutter_colorpicker: ^1.1.0
  loading_indicator: ^3.1.0

  # --- Graphiques ---
  fl_chart: ^0.68.0

  # --- Localisation, Géolocalisation & utilitaires ---
  intl: ^0.20.2
  email_validator: ^3.0.0
  logger: ^2.3.0
  timeago: ^3.6.1
  diacritic: ^0.1.3

  # ⭐ GÉOLOCALISATION
  geolocator: ^11.0.1
  geocoding: ^2.2.1
  flutter_polyline_points: ^2.0.0

  # --- Stockage & données ---
  shared_preferences: ^2.2.3
  uuid: ^4.4.0

  # --- Gestion fichiers & images ---
  file_picker: ^8.0.3
  path: ^1.9.0
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1
  screenshot: ^3.0.0
  image_picker: ^1.0.4  # <-- Package ajouté pour sélectionner des images

  # --- Supabase (remplace Firebase) ---
  supabase_flutter: ^2.5.6   # Auth + Database (Postgres) + Realtime + Storage

  # --- Notifications locales ---
  flutter_local_notifications: ^17.1.2

  # --- Réseau ---
  http: ^1.2.1
  url_launcher: ^6.3.1
  app_links: ^6.1.1

  # --- Audio ---
  audioplayers: ^6.0.0

  # --- Carte interactive ---
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # --- Partage ---
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo_yeshua.png
    - assets/images/evenement1.jpg
    - assets/images/evenement2.jpg
    - assets/images/tutoioschrome.png
    - assets/Bibles/fr/
    - assets/Bibles/en/
    - assets/Bibles/es/
    - assets/Bibles/pt/
    - assets/web_player/
    - assets/themes/
    - assets/sounds/
    - assets/sounds/notification.mp3
    - assets/models/